const CH=[["A","A better"],["B","B better"],["same","About the same"],["both_wrong","Both wrong"]];
const KEY="highlight-rating:"+ITEMS.map(i=>i.id).join(",");
let R={};try{R=JSON.parse(localStorage.getItem(KEY)||"{}")}catch{}
let i=0;while(i<ITEMS.length&&R[ITEMS[i].id])i++;
const $=id=>document.getElementById(id);
const side=(it,s,l)=>`<div class="side"><b>${l}</b><svg viewBox="0 0 ${it.w} ${it.h}"><image href="${it.img}" width="${it.w}" height="${it.h}"/><path d="${s.d}" transform="translate(${s.tx} ${s.ty})"/></svg></div>`;
function csv(){return "item_id,choice,rated_at\n"+ITEMS.filter(x=>R[x.id]).map(x=>[x.id,R[x.id].choice,R[x.id].at].join(",")).join("\n")+"\n"}
function dl(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv()],{type:"text/csv"}));a.download="ratings.csv";a.click()}
function render(){
  const n=Object.keys(R).length;
  $("prog").textContent=`${Math.min(i+1,ITEMS.length)} / ${ITEMS.length} (rated ${n})`;
  if(!ITEMS.length){$("main").innerHTML="<p style='padding:16px'>No items in this sample.</p>";return}
  if(i>=ITEMS.length){$("goal").textContent="Done";$("main").innerHTML=`<nav><button id="dl">Download ratings.csv</button><button id="back">Back</button></nav>`;$("dl").onclick=dl;$("back").onclick=()=>{i=ITEMS.length-1;render()};return}
  const it=ITEMS[i],cur=R[it.id]?.choice;
  $("goal").textContent=it.goal?`Goal: ${it.goal}`:"";
  $("main").innerHTML=`<div class="pair">${side(it,it.a,"A")}${side(it,it.b,"B")}</div><nav>${CH.map(([v,t],k)=>`<button data-v="${v}" class="${cur===v?"on":""}">${k+1}. ${t}</button>`).join("")}<button id="prev">Back</button></nav>`;
  document.querySelectorAll("button[data-v]").forEach(b=>b.onclick=()=>pick(b.dataset.v));
  $("prev").onclick=()=>{if(i>0){i--;render()}};
}
function pick(v){R[ITEMS[i].id]={choice:v,at:new Date().toISOString()};try{localStorage.setItem(KEY,JSON.stringify(R))}catch{}i++;render()}
addEventListener("keydown",e=>{const k=+e.key;if(k>=1&&k<=4&&i<ITEMS.length)pick(CH[k-1][0])});
