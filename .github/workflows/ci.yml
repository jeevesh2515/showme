name: ci

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the push commit range; shallow clone breaks it

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync
        run: |
          uv sync --project backend
          uv sync --project eval

      # API-8: the typed web client is generated from the backend OpenAPI; drift fails CI.
      - name: API client drift
        run: |
          python3 scripts/gen_api_client.py
          git diff --exit-code apps/web/lib/api/

      - name: Lint
        run: |
          uv run --project backend ruff check backend eval
          uv run --project backend ruff format --check backend eval

      - name: Type-check
        run: uv run --project backend mypy --strict backend/showme/core

      - name: Test
        run: |
          uv run --project backend pytest backend/tests -q
          uv run --project eval pytest eval/tests -q

      - name: Docker build
        run: docker build backend

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "10" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Playwright (PRIV-1, PRIV-4, FLOW-1..13; API route-mocked, no live spend)
        run: |
          (pnpm --filter web exec next start -p 3000 &)
          sleep 5
          pnpm --filter web test:e2e
